<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <!-- Inner Glow Border -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />

  <!-- Browser Header Bar -->
  <line x1="60" y1="110" x2="452" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <!-- Window Control Dots -->
  <circle cx="85" cy="75" r="10" fill="#ef4444" />
  <circle cx="120" cy="75" r="10" fill="#f59e0b" />
  <circle cx="155" cy="75" r="10" fill="#10b981" />

  <!-- Quantum Orbital Rings -->
  <ellipse cx="256" cy="300" rx="150" ry="60" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.75" />
  
  <g transform="rotate(40 256 300)">
    <ellipse cx="256" cy="300" rx="150" ry="60" fill="none" stroke="#10b981" stroke-width="8" opacity="0.85" />
    <circle cx="406" cy="300" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
  </g>

  <!-- Central AI Core -->
  <circle cx="256" cy="300" r="76" fill="url(#coreGrad)" stroke="#6ee7b7" stroke-width="10" filter="url(#glow)" />
  <circle cx="256" cy="300" r="32" fill="#ffffff" />
</svg>
